apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}-albireo}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-albireo}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: albireo, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: albireo, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      serviceAccountName: {{ .Release.Name }}-albireo
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: albireo
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          args: ["serve", "--config", "/etc/albireo/albireo.yaml"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          ports: [{name: peer, containerPort: 9500, protocol: UDP}, {name: health, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /health, port: health}}
          readinessProbe: {httpGet: {path: /ready, port: health}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: identity, mountPath: /run/secrets/albireo, readOnly: true}, {name: state, mountPath: /var/lib/albireo}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: identity, secret: {secretName: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}}}, {name: state, emptyDir: {}}, {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-albireo}
spec:
  selector: {app.kubernetes.io/name: albireo, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: peer, port: {{ .Values.service.udpPort }}, targetPort: peer, protocol: UDP}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ .Release.Name }}-albireo}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: albireo, app.kubernetes.io/instance: {{ .Release.Name }}}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-albireo-default-deny}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: albireo, app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
{{- end }}
